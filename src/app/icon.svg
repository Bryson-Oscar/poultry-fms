<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Golden Yolk Gradient -->
    <linearGradient id="yolkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Rounded Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glowing Ring -->
  <path d="M 256 60 C 160 60 110 180 110 320 C 110 420 170 452 256 452 C 342 452 402 420 402 320 C 402 180 352 60 256 60 Z"
        fill="none" stroke="url(#yolkGrad)" stroke-width="12" filter="url(#glow)" opacity="0.9" />

  <!-- Main Golden Egg Solid Fill -->
  <path d="M 256 80 C 175 80 130 190 130 315 C 130 405 182 432 256 432 C 330 432 382 405 382 315 C 382 190 337 80 256 80 Z"
        fill="url(#yolkGrad)" />

  <!-- Inner Dark Core Shadow -->
  <path d="M 256 115 C 190 115 155 205 155 308 C 155 382 198 402 256 402 C 314 402 357 382 357 308 C 357 205 322 115 256 115 Z"
        fill="#111110" />

  <!-- AgTech Circuit Tree Lines & Nodes Inside Egg Core -->
  <g fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <path d="M 256 380 L 256 210" />
    
    <!-- Left Branches -->
    <path d="M 256 340 L 210 300 L 180 300" />
    <path d="M 256 290 L 200 245 L 200 215" />
    <path d="M 256 240 L 225 210 L 225 175" />

    <!-- Right Branches -->
    <path d="M 256 340 L 302 300 L 332 300" />
    <path d="M 256 290 L 312 245 L 312 215" />
    <path d="M 256 240 L 287 210 L 287 175" />

    <!-- Top Apex Node Lines -->
    <path d="M 256 210 L 240 165" />
    <path d="M 256 210 L 272 165" />
  </g>

  <!-- Glowing Circuit Nodes (Gold Dots) -->
  <g fill="#fbbf24">
    <circle cx="180" cy="300" r="7" />
    <circle cx="200" cy="215" r="7" />
    <circle cx="225" cy="175" r="7" />
    <circle cx="240" cy="165" r="6" />
    
    <circle cx="332" cy="300" r="7" />
    <circle cx="312" cy="215" r="7" />
    <circle cx="287" cy="175" r="7" />
    <circle cx="272" cy="165" r="6" />

    <circle cx="256" cy="150" r="8" fill="#fef3c7" filter="url(#glow)" />
  </g>
</svg>
